<!DOCTYPE html>
<!-- Declaración del tipo de documento: indica al navegador que es HTML5 -->
<html lang="es">
<!-- Elemento raíz de la página; lang="es" indica que el contenido está en español -->
<head>
  <!-- Sección de metadatos: información que el navegador lee pero no se muestra en la página -->
  <meta charset="UTF-8">
  <!-- Define la codificación de caracteres UTF-8 para mostrar acentos y emojis correctamente -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- Hace que la página se adapte al ancho de la pantalla de celulares y tabletas -->
  <title>Dashboard - Tarea 6</title>
  <!-- Título que aparece en la pestaña del navegador -->
  <style>
    /* Inicio del bloque de estilos CSS interno */
    * { margin: 0; padding: 0; box-sizing: border-box; }
    /* Quita márgenes y rellenos por defecto de todos los elementos y usa un modelo de caja uniforme */
    body { font-family: 'Trebuchet MS', sans-serif; background: #fef9c3; color: #422006; }
    /* Cambia la tipografía, pone el fondo amarillo claro y el texto café oscuro en todo el cuerpo */
    .layout { display: flex; min-height: 100vh; }
    /* Organiza la barra lateral y el contenido en columnas, con altura mínima de toda la pantalla */
    .sidebar {
      width: 220px;
      background: #eab308;
      /* Fondo amarillo dorado para la barra lateral */
      color: #1c1917;
      /* Texto casi negro para contrastar con el amarillo */
      padding: 1.5rem 1rem;
      /* Espacio interior arriba/abajo y a los lados de la barra */
    }
    .sidebar h2 { margin-bottom: 1.5rem; color: #1c1917; }
    /* Separa el título "Admin" del menú y le da color oscuro */
    .sidebar nav { display: flex; flex-direction: column; gap: 0.5rem; }
    /* Apila los enlaces del menú uno debajo del otro con separación */
    .sidebar a {
      color: #422006;
      /* Color café para los enlaces del menú */
      text-decoration: none;
      /* Quita la línea subrayada de los enlaces */
      padding: 0.5rem;
      /* Espacio interior alrededor de cada enlace */
      border-radius: 4px;
      /* Esquinas ligeramente redondeadas */
    }
    .sidebar a:hover, .sidebar a.activo {
      background: #facc15;
      /* Al pasar el ratón o en el enlace activo, fondo amarillo más intenso */
      color: #000000;
      /* Texto negro en el estado activo o con el ratón encima */
    }
    .contenido { flex: 1; padding: 2rem; }
    /* El área principal ocupa el espacio restante y tiene relleno interior */
    .contenido h1 { margin-bottom: 1.5rem; color: #92400e; }
    /* Título de bienvenida en tono ámbar oscuro */
    .tarjetas {
      display: grid;
      /* Organiza las tarjetas en una cuadrícula */
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      /* Crea tantas columnas como quepan, con un mínimo de 180 px cada una */
      gap: 1rem;
      /* Espacio entre tarjetas */
    }
    .tarjeta {
      background: #fffbeb;
      /* Fondo crema para cada tarjeta */
      padding: 1.5rem;
      /* Espacio interior de cada tarjeta */
      border-radius: 12px;
      /* Esquinas más redondeadas que la versión original */
      box-shadow: 0 4px 10px rgba(180, 83, 9, 0.25);
      /* Sombra color ámbar para dar profundidad */
      border: 2px solid #f59e0b;
      /* Borde naranja-dorado de 2 px */
    }
    .tarjeta h3 { font-size: 0.9rem; color: #b45309; margin-bottom: 0.5rem; }
    /* Subtítulo de cada tarjeta en color naranja oscuro */
    .numero { font-size: 1.8rem; font-weight: bold; color: #7c2d12; }
    /* Cifra grande de cada tarjeta, en color rojo-café */
    .imagen-banner {
      width: 100%;
      /* Ocupa todo el ancho disponible */
      max-height: 180px;
      /* Limita la altura máxima de la imagen */
      object-fit: cover;
      /* Recorta la imagen para llenar el espacio sin deformarse */
      border-radius: 8px;
      /* Esquinas redondeadas en la imagen */
      margin-bottom: 1.5rem;
      /* Espacio debajo de la imagen */
    }
    .video-bloque, .audio-bloque {
      margin-top: 2rem;
      /* Separación superior de los bloques de video y audio */
      background: #fffbeb;
      /* Fondo crema para los bloques multimedia */
      padding: 1rem;
      /* Relleno interior de los bloques */
      border-radius: 8px;
      /* Esquinas redondeadas de los bloques */
    }
    .video-bloque h3, .audio-bloque h3 { color: #92400e; margin-bottom: 0.5rem; }
    /* Subtítulos de los bloques multimedia en ámbar oscuro */
    .video-bloque iframe { width: 100%; height: 315px; border: 0; }
    /* El video ocupa todo el ancho, mide 315 px de alto y no tiene borde */
    .audio-bloque audio { width: 100%; }
    /* El reproductor de audio ocupa todo el ancho del bloque */
    .galeria { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0.75rem; margin-top: 2rem; }
    /* Galería de tres columnas iguales con separación entre imágenes */
    .galeria img { width: 100%; height: 120px; object-fit: cover; border-radius: 6px; }
    /* Cada imagen de la galería llena su celda, con altura fija y esquinas redondeadas */
  </style>
  <!-- Fin del bloque de estilos CSS -->
</head>
<body>
  <!-- Contenido visible de la página -->
  <div class="layout">
    <!-- Contenedor principal que organiza la barra lateral y el contenido -->
    <aside class="sidebar">
      <!-- Barra lateral de navegación -->
      <h2>Admin</h2>
      <!-- Título de la barra lateral -->
      <nav>
        <!-- Contenedor del menú de navegación -->
        <a href="#" class="activo">📊 Resumen</a>
        <!-- Enlace de la sección activa -->
        <a href="#">📦 Pedidos</a>
        <!-- Enlace a la sección de pedidos -->
        <a href="#">👥 Usuarios</a>
        <!-- Enlace a la sección de usuarios -->
        <a href="#">⚙️ Ajustes</a>
        <!-- Enlace a la sección de ajustes -->
      </nav>
    </aside>

    <main class="contenido">
      <!-- Área principal con la información del dashboard -->
      <img class="imagen-banner" src="https://images.unsplash.com/photo-1551288049-bebda4e38f71?w=1200" alt="Gráfica de barras de datos">
      <!-- Recurso visual 1: imagen de banner con gráfica de datos -->
      <h1>Bienvenido, Ana</h1>
      <!-- Título de bienvenida (antes tenía un comentario dinámico) -->
      <div class="tarjetas">
        <!-- Contenedor de las tarjetas de indicadores -->
        <div class="tarjeta">
          <!-- Primera tarjeta: pedidos del día -->
          <h3>Pedidos hoy</h3>
          <!-- Etiqueta de la tarjeta -->
          <p class="numero">24</p>
          <!-- Valor numérico de pedidos -->
        </div>
        <div class="tarjeta">
          <!-- Segunda tarjeta: ingresos -->
          <h3>Ingresos</h3>
          <!-- Etiqueta de la tarjeta -->
          <p class="numero">$1,240</p>
          <!-- Valor de ingresos -->
        </div>
        <div class="tarjeta">
          <!-- Tercera tarjeta: usuarios nuevos -->
          <h3>Usuarios nuevos</h3>
          <!-- Etiqueta de la tarjeta -->
          <p class="numero">7</p>
          <!-- Valor de usuarios nuevos -->
        </div>
      </div>

      <section class="video-bloque">
        <!-- Bloque que contiene el video incrustado -->
        <h3>Video: resumen de ventas</h3>
        <!-- Título del video -->
        <iframe src="https://www.youtube.com/embed/dQw4w9WgXcQ" title="Video de ejemplo" allowfullscreen></iframe>
        <!-- Recurso visual 2: video incrustado de YouTube -->
      </section>

      <section class="audio-bloque">
        <!-- Bloque que contiene el audio -->
        <h3>Audio: informe semanal</h3>
        <!-- Título del audio -->
        <audio controls src="https://www.w3schools.com/html/horse.mp3"></audio>
        <!-- Recurso 3: reproductor de audio con controles -->
      </section>

      <div class="galeria">
        <!-- Galería de imágenes en cuadrícula de tres columnas -->
        <img src="https://images.unsplash.com/photo-1460925895917-afdab827c52f?w=600" alt="Computadora con gráficas">
        <!-- Recurso 4: imagen de computadora con gráficas -->
        <img src="https://images.unsplash.com/photo-1554224155-6726b3ff858f?w=600" alt="Análisis financiero">
        <!-- Recurso 5: imagen de análisis financiero -->
        <img src="https://images.unsplash.com/photo-1518186285589-2f7649de83e3?w=600" alt="Tabla de datos">
        <!-- Recurso 6: imagen de tabla de datos -->
      </div>
    </main>
  </div>
</body>
</html>
